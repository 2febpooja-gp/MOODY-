<!DOCTYPE html>
<html>
    <head>
        <title>Moody Login</title>
        <link rel="stylesheet" href="login.css">
    </head>

    <body>

        <div class="login-box">
            <h1>Moody</h1>

            <input
            type="text"
            id="username"
            placeholder="username">

            <input
            type="password"
            id="password"
            placeholder="Password">

            <button id="loginBtn">
                Login
            </button>

            <p id="message"></p>

            <p class="signup-text">

                No account?

                <span id="signupLink">
                    Sign Up
                </span>
            </p>

        </div>

        <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script src="login.js"></script>
    </body>
</html>
