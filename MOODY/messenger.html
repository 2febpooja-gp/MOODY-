<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Moody messenger</title>

    <link rel="stylesheet" href="messenger.css">

</head>

<body>

    <div id="messengerPage">

        <div class="messenger-header">
            
            <h2>Messenger</h2>
        
        </div>

        <div class="search-box">
            <input
            type="text"
            id="searchUser"
            placeholder="Search people...">
        </div>

        <div id="chatList">

        </div>

        <div class="bottom-nav">
            <div id="homeBtn">
                <img src="home.png" class="home-icon">
            </div>

            <div id="messengerBtn">
                <img src="messenger.png"
                class="nav-icon">

            </div>

            <div id="addMood">
                <img src="post.png" class="nav-icon">
            </div>

            <div id="profileBtn">
                <img src="profile.png" class="nav-icon">
            </div>
        </div>

    </div>

    <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="messenger.js"></script>

</body>
</html>
