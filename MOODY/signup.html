 <!DOCTYPE html>
 <html>
    <head>
        <title>Moody sign uo</title>
        <link rel="stylesheet" href="signup.css">
    </head>

    <body>
        <div class="signup-box">

            <h1>Moody</h1>

            <input
            type="text"
            id="username"
            placeholder="username">

            <input
            type="password"
            id="password"
            placeholder="password">

            <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password">

            <button id="signupBtn">
                Sign Up
            </button>

            <p id="message"></p>

            <p class="login-text">

                Already have account?

                <span id="loginLink">
                    Login
                </span>
            </p>
        </div>

        <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script src="signup.js"></script>
        
    </body>
 </html>
